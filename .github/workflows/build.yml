name: Build MNMaxUnlock.dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/theos/theos:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dylib
        run: |
          clang -shared \
                -fobjc-arc \
                -framework Foundation \
                -framework StoreKit \
                -framework UIKit \
                -o MNMaxUnlock.dylib \
                src/MNMaxUnlock.mm \
                -arch arm64 \
                -isysroot $THEOS/sdks/iPhoneOS16.5.sdk \
                -miphoneos-version-min=15.0 \
                -I$THEOS/include

      - name: Check output
        run: file MNMaxUnlock.dylib && ls -la MNMaxUnlock.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNMaxUnlock.dylib
          path: MNMaxUnlock.dylib
