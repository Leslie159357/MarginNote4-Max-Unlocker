name: Build and Inject

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build-and-inject:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IPA from Release
        run: |
          gh release download v1.0.0 --pattern "MarginNote4.ipa" --dir ./input
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compile dylib
        run: |
          clang -shared \
                -framework Foundation \
                -framework StoreKit \
                -framework UIKit \
                -o MNMaxUnlock.dylib \
                src/MNMaxUnlock.mm \
                -arch arm64 \
                -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
                -miphoneos-version-min=15.0 \
                -fobjc-arc
          echo "dylib compiled: $(ls -lh MNMaxUnlock.dylib)"

      - name: Inject and Repack
        shell: bash
        run: |
          set +e
          mkdir -p tmp
          echo "=== Extracting IPA ==="
          unzip -qo "input/MarginNote4.ipa" -d tmp 2>&1
          echo "=== Checking Payload ==="
          ls tmp/Payload/ 2>&1 || echo "No Payload dir"
          find tmp/Payload -maxdepth 2 -name "*.app" 2>&1 || echo "No .app found"
          APP=$(find tmp/Payload -maxdepth 2 -name "*.app" -type d | head -1)
          echo "APP bundle: $APP"
          ls -la "$APP/" | head -5
          echo "=== Copy dylib ==="
          cp -v MNMaxUnlock.dylib "$APP/"
          EXE=$(find "$APP" -maxdepth 1 -type f -perm +111 | head -1)
          if [ -z "$EXE" ]; then
            EXE="$APP/MarginNote 4"
          fi
          echo "Binary: $EXE"
          ls -la "$EXE"
          echo "=== Inject dylib ==="
          python3 tools/inject.py "$EXE" "@executable_path/MNMaxUnlock.dylib"
          echo "=== Repack ==="
          cd tmp && zip -q -r ../MarginNote4-Unlocked.ipa Payload/ && cd ..
          echo "Final IPA: $(ls -lh MarginNote4-Unlocked.ipa)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarginNote4-Unlocked.ipa
          path: MarginNote4-Unlocked.ipa
          compression-level: 0
