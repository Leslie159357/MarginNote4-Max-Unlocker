name: Build and Inject

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build-and-inject:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IPA from Release
        run: |
          gh release download v1.0.0 --pattern "MarginNote4.ipa" --dir ./input
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compile dylib
        run: |
          clang -shared \
                -framework Foundation \
                -framework StoreKit \
                -framework UIKit \
                -o MNMaxUnlock.dylib \
                src/MNMaxUnlock.mm \
                -arch arm64 \
                -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
                -miphoneos-version-min=15.0 \
                -fobjc-arc
          echo "dylib compiled: $(ls -lh MNMaxUnlock.dylib)"

      - name: Inject and Repack
        run: |
          mkdir -p tmp
          unzip -q "input/MarginNote4.ipa" -d tmp
          APP="tmp/Payload/MarginNote 4.app"
          cp MNMaxUnlock.dylib "$APP/"
          python3 tools/inject.py "$APP/MarginNote 4" "@executable_path/MNMaxUnlock.dylib"
          cd tmp && zip -q -r ../MarginNote4-Unlocked.ipa Payload/ && cd ..
          echo "Final IPA: $(ls -lh MarginNote4-Unlocked.ipa)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarginNote4-Unlocked.ipa
          path: MarginNote4-Unlocked.ipa
          compression-level: 0
