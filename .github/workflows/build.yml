name: Build MNMaxUnlock.dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Xcode clang
        run: |
          clang -shared \
                -framework Foundation \
                -framework StoreKit \
                -framework UIKit \
                -o MNMaxUnlock.dylib \
                src/MNMaxUnlock.mm \
                -arch arm64 \
                -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
                -miphoneos-version-min=15.0 \
                -fobjc-arc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNMaxUnlock.dylib
          path: MNMaxUnlock.dylib
